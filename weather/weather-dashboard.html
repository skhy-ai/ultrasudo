<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Weather Dashboard</title>
    <script src="../desktop/data-manager.js"></script>
    <script src="../desktop/file-helper.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }
        .weather-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        .icon-container {
            width: 80px;
            height: 80px;
        }
         /* Loader animation */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom scrollbar for hourly forecast */
        #hourly-forecast::-webkit-scrollbar {
            height: 8px;
        }
        #hourly-forecast::-webkit-scrollbar-track {
            background: #e0e7ff;
            border-radius: 10px;
        }
        #hourly-forecast::-webkit-scrollbar-thumb {
            background: #6366f1;
            border-radius: 10px;
        }
        #hourly-forecast::-webkit-scrollbar-thumb:hover {
            background: #4f46e5;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <script src="../desktop/file-helper.js"></script>
    <div id="weather-container" class="w-full max-w-4xl mx-auto">

        <!-- Loading Indicator -->
        <div id="loader" class="flex flex-col items-center justify-center">
            <div class="loader mb-4"></div>
            <p class="text-gray-600">Fetching weather data...</p>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="hidden text-center p-8 bg-red-100 text-red-700 rounded-2xl">
            <h2 class="text-xl font-bold mb-2">Oops! Something went wrong.</h2>
            <p id="error-text"></p>
        </div>

        <!-- Manual Search Input -->
        <div id="manual-search" class="hidden p-6 weather-card">
             <h2 class="text-xl font-bold mb-2 text-center text-gray-700">Enter a Location</h2>
             <p class="text-center text-gray-500 mb-4">Since location access was denied, please enter a city name to get started.</p>
             <form id="search-form" class="flex gap-2">
                 <input type="text" id="location-input" placeholder="e.g., Paris, France" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                 <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition-colors">Search</button>
             </form>
             <p id="manual-search-error" class="text-red-500 text-center mt-2"></p>
        </div>

        <!-- Main Weather Content -->
        <div id="content" class="hidden">
            <!-- Location Manager -->
            <div id="location-manager" class="p-4 mb-6 weather-card">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <h2 class="text-lg font-semibold text-gray-700">My Locations</h2>
                    <button id="add-location-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-bold py-2 px-3 rounded-lg transition-colors">Add New</button>
                </div>
                <div id="saved-locations-list" class="mt-3 flex flex-wrap gap-2">
                    <!-- Saved location buttons injected here -->
                </div>
            </div>

            <!-- Header -->
            <div class="text-center mb-8">
                <h1 id="location-name" class="text-3xl md:text-4xl font-bold text-gray-800">--</h1>
                <p id="current-time" class="text-gray-500"></p>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Current Weather Section -->
                <div class="lg:col-span-1 weather-card p-6 flex flex-col items-center justify-center text-center">
                    <h2 class="text-xl font-semibold text-gray-700 mb-2">Now</h2>
                    <div id="current-icon" class="icon-container mb-4"></div>
                    <p id="current-temp" class="text-5xl font-bold text-gray-900">--°</p>
                    <p id="current-desc" class="text-gray-600 capitalize">--</p>
                    <p id="current-wind" class="text-sm text-gray-500 mt-2">Wind: -- km/h</p>
                </div>

                <!-- Hourly Forecast Section -->
                <div class="lg:col-span-2 weather-card p-6">
                    <h2 class="text-xl font-semibold text-gray-700 mb-4">Hourly Forecast</h2>
                    <div id="hourly-forecast" class="flex overflow-x-auto space-x-4 pb-4">
                        <!-- Hourly items will be injected here -->
                    </div>
                </div>
            </div>

            <!-- Daily Forecast Section -->
            <div class="weather-card p-6 mt-6">
                 <h2 class="text-xl font-semibold text-gray-700 mb-4">7-Day Forecast</h2>
                 <div id="daily-forecast" class="space-y-4">
                     <!-- Daily items will be injected here -->
                 </div>
            </div>
            
            <footer class="text-center text-xs text-gray-400 mt-6">
                <p>Weather data provided by Open-Meteo.com</p>
            </footer>
        </div>

    </div>

    <script>
        // --- DOM Elements ---
        const loader = document.getElementById('loader');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const content = document.getElementById('content');
        const manualSearch = document.getElementById('manual-search');
        const searchForm = document.getElementById('search-form');
        const locationInput = document.getElementById('location-input');
        const manualSearchError = document.getElementById('manual-search-error');
        
        const locationManager = document.getElementById('location-manager');
        const savedLocationsList = document.getElementById('saved-locations-list');
        const addLocationBtn = document.getElementById('add-location-btn');

        const locationName = document.getElementById('location-name');
        const currentTime = document.getElementById('current-time');
        const currentIcon = document.getElementById('current-icon');
        const currentTemp = document.getElementById('current-temp');
        const currentDesc = document.getElementById('current-desc');
        const currentWind = document.getElementById('current-wind');
        const hourlyForecastContainer = document.getElementById('hourly-forecast');
        const dailyForecastContainer = document.getElementById('daily-forecast');
        
        // --- State ---
        let savedLocations = [];
        let activeLocationIndex = 0;

        // --- Weather Code to Icon and Description Mapping ---
        const weatherCodes = {
            0: { desc: "Clear sky", icon: "sun" }, 1: { desc: "Mainly clear", icon: "sun-cloud" }, 2: { desc: "Partly cloudy", icon: "cloud" }, 3: { desc: "Overcast", icon: "cloud" }, 45: { desc: "Fog", icon: "fog" }, 48: { desc: "Depositing rime fog", icon: "fog" }, 51: { desc: "Light drizzle", icon: "drizzle" }, 53: { desc: "Moderate drizzle", icon: "drizzle" }, 55: { desc: "Dense drizzle", icon: "drizzle" }, 56: { desc: "Light freezing drizzle", icon: "drizzle-snow" }, 57: { desc: "Dense freezing drizzle", icon: "drizzle-snow" }, 61: { desc: "Slight rain", icon: "rain" }, 63: { desc: "Moderate rain", icon: "rain" }, 65: { desc: "Heavy rain", icon: "rain-heavy" }, 66: { desc: "Light freezing rain", icon: "rain-snow" }, 67: { desc: "Heavy freezing rain", icon: "rain-snow" }, 71: { desc: "Slight snow fall", icon: "snow" }, 73: { desc: "Moderate snow fall", icon: "snow" }, 75: { desc: "Heavy snow fall", icon: "snow-heavy" }, 77: { desc: "Snow grains", icon: "snow" }, 80: { desc: "Slight rain showers", icon: "rain" }, 81: { desc: "Moderate rain showers", icon: "rain" }, 82: { desc: "Violent rain showers", icon: "rain-heavy" }, 85: { desc: "Slight snow showers", icon: "snow" }, 86: { desc: "Heavy snow showers", icon: "snow-heavy" }, 95: { desc: "Thunderstorm", icon: "thunderstorm" }, 96: { desc: "Thunderstorm with slight hail", icon: "thunderstorm-hail" }, 99: { desc: "Thunderstorm with heavy hail", icon: "thunderstorm-hail" },
        };
        const weatherIcons = {
            sun: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-yellow-500"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`, 'sun-cloud': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-gray-600"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path><path d="M12 2v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="M20 12h2"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M12 22v-2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="M4 12H2"></path><path d="m6.34 6.34-1.41-1.41"></path></svg>`, cloud: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-gray-500"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>`, fog: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-gray-500"><path d="M22 12a4.5 4.5 0 0 0-4.5-4.5H5.71a5.81 5.81 0 0 0 0 11.62h12.58a3.6 3.6 0 0 0 3.6-3.6 3.6 3.6 0 0 0-3.6-3.6h-13"></path></svg>`, drizzle: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-blue-400"><path d="M8 19v-1a4 4 0 0 1-4-4 4 4 0 0 1 4-4v-1"></path><path d="M12 11v-1a4 4 0 0 0-4-4 4 4 0 0 0 4 4v-1"></path><path d="M16 7v-1a4 4 0 0 0-4-4 4 4 0 0 0 4 4v-1"></path><path d="M12 19v-1a4 4 0 0 1-4-4 4 4 0 0 1 4-4v-1"></path><path d="M16 15v-1a4 4 0 0 0-4-4 4 4 0 0 0 4 4v-1"></path><path d="M20 11v-1a4 4 0 0 0-4-4 4 4 0 0 0 4 4v-1"></path></svg>`, rain: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-blue-500"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path><path d="m8 14-4 4"></path><path d="m12 16-4 4"></path><path d="m16 16-4 4"></path></svg>`, 'rain-heavy': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-blue-600"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path><path d="m7 14-4 4"></path><path d="m11 16-4 4"></path><path d="m15 16-4 4"></path><path d="m19 14-4 4"></path></svg>`, snow: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-cyan-400"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path><path d="m8 15 4 4"></path><path d="m12 15 4 4"></path><path d="m16 15 4 4"></path><path d="m8 19 4-4"></path><path d="m12 19 4-4"></path><path d="m16 19 4-4"></path></svg>`, 'snow-heavy': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-cyan-500"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path><path d="m7 15 4 4"></path><path d="m11 15 4 4"></path><path d="m15 15 4 4"></path><path d="m7 19 4-4"></path><path d="m11 19 4-4"></path><path d="m15 19 4-4"></path><path d="m3 15 4 4"></path><path d="m19 15 4 4"></path><path d="m3 19 4-4"></path><path d="m19 19 4-4"></path></svg>`, 'rain-snow': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-teal-400"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path><path d="m8 14-4 4"></path><path d="m12 16-4 4"></path><path d="m16 15 4 4"></path><path d="m12 19 4-4"></path></svg>`, thunderstorm: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-purple-600"><path d="M21.73 18a2.6 2.6 0 0 0-2.28-1.5H9.6a8 8 0 0 0-7.82 6.33"></path><path d="M13 12l-3 5h4l-3 5"></path></svg>`, 'thunderstorm-hail': `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-full h-full text-indigo-600"><path d="M21.73 18a2.6 2.6 0 0 0-2.28-1.5H9.6a8 8 0 0 0-7.82 6.33"></path><path d="M13 12l-3 5h4l-3 5"></path><path d="M10.22 17.5c0 .28-.22.5-.5.5s-.5-.22-.5-.5.22-.5.5-.5.5.22.5.5z"></path><path d="M14.22 17.5c0 .28-.22.5-.5.5s-.5-.22-.5-.5.22-.5.5-.5.5.22.5.5z"></path></svg>`,
        };

        // --- Main App Logic ---
        window.addEventListener('load', () => {
            savedLocations = JSON.parse(localStorage.getItem('savedLocations')) || [];
            if (savedLocations.length > 0) {
                loadWeatherForLocation(activeLocationIndex);
                updateLocationsUI();
            } else {
                if (navigator.geolocation) {
                    loader.classList.remove('hidden');
                    navigator.geolocation.getCurrentPosition(
                        (pos) => geolocSuccess(pos.coords.latitude, pos.coords.longitude), 
                        geolocError
                    );
                } else {
                    showManualSearchUI("Geolocation is not supported by your browser.");
                }
            }
        });

        addLocationBtn.addEventListener('click', () => showManualSearchUI());
        searchForm.addEventListener('submit', handleManualSearch);

        async function geolocSuccess(latitude, longitude) {
            try {
                const locationDetails = await reverseGeocode(latitude, longitude);
                addLocation(locationDetails);
            } catch (err) {
                showError("Could not determine your location name.");
            }
        }

        function geolocError(error) {
            let message = "Could not get your location. Please enter one manually.";
            if (error.code === error.PERMISSION_DENIED) {
                message = "You denied location access. Please enter a location manually.";
            }
            showManualSearchUI(message);
        }

        async function handleManualSearch(e) {
            e.preventDefault();
            const query = locationInput.value.trim();
            if (!query) return;

            manualSearchError.textContent = '';
            loader.classList.remove('hidden');
            manualSearch.classList.add('hidden');

            try {
                const results = await forwardGeocode(query);
                if (results.length === 0) {
                    throw new Error("Location not found.");
                }
                const { lat, lon, display_name } = results[0];
                const locationDetails = { latitude: lat, longitude: lon, name: display_name };
                addLocation(locationDetails);
                locationInput.value = '';
            } catch (err) {
                manualSearchError.textContent = `Error: ${err.message}. Please try again.`;
                showManualSearchUI();
            }
        }
        
        async function forwardGeocode(query) {
             const apiUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`;
             const response = await fetch(apiUrl);
             if (!response.ok) throw new Error("Failed to contact geocoding service.");
             return await response.json();
        }

        async function reverseGeocode(lat, lon) {
             const apiUrl = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`;
             const response = await fetch(apiUrl);
             if (!response.ok) throw new Error("Location data fetch failed");
             const data = await response.json();
             return { latitude: lat, longitude: lon, name: data.display_name };
        }

        function addLocation(locationDetails) {
            const newLocation = {
                name: locationDetails.name,
                lat: locationDetails.latitude,
                lon: locationDetails.longitude,
            };

            const existingIndex = savedLocations.findIndex(loc => loc.lat === newLocation.lat && loc.lon === newLocation.lon);

            if (existingIndex > -1) {
                activeLocationIndex = existingIndex;
            } else {
                savedLocations.push(newLocation);
                activeLocationIndex = savedLocations.length - 1;
            }
            
            saveAndReload();
        }
        
        function switchLocation(index) {
            if (index >= 0 && index < savedLocations.length) {
                activeLocationIndex = index;
                loadWeatherForLocation(index);
                updateLocationsUI();
            }
        }

        function deleteLocation(index) {
            if (index >= 0 && index < savedLocations.length) {
                savedLocations.splice(index, 1);
                if (activeLocationIndex >= index) {
                    activeLocationIndex = Math.max(0, activeLocationIndex - 1);
                }
                saveAndReload();
            }
        }

        function saveAndReload() {
            localStorage.setItem('savedLocations', JSON.stringify(savedLocations));
            if (savedLocations.length > 0) {
                loadWeatherForLocation(activeLocationIndex);
                updateLocationsUI();
            } else {
                showManualSearchUI("No locations saved. Add one to begin.");
                content.classList.add('hidden');
                locationManager.classList.add('hidden');
            }
        }
        
        async function loadWeatherForLocation(index) {
            const location = savedLocations[index];
            if (!location) {
                showManualSearchUI("No location selected.");
                return;
            }

            showLoader();
            try {
                const weatherData = await fetchWeather(location.lat, location.lon);
                displayWeatherData(location.name, weatherData);
                showContent();
            } catch (err) {
                console.error("Error fetching data:", err);
                showError("Could not fetch weather data for the selected location.");
            }
        }
        
        async function fetchWeather(lat, lon) {
            const apiUrl = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto`;
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error("Weather data fetch failed");
            return await response.json();
        }

        function displayWeatherData(name, weatherData) {
            // Location & Time
            locationName.textContent = name;
            const utcOffset = weatherData.utc_offset_seconds * 1000;
            const now = new Date();
            const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
            const locationTime = new Date(utcTime + utcOffset);
            currentTime.textContent = locationTime.toLocaleDateString(undefined, {
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
            }) + ' ' + locationTime.toLocaleTimeString();

            // Current Weather
            const current = weatherData.current;
            const currentCodeInfo = weatherCodes[current.weather_code] || { desc: "Unknown", icon: "cloud" };
            currentIcon.innerHTML = weatherIcons[currentCodeInfo.icon];
            currentTemp.textContent = `${Math.round(current.temperature_2m)}°`;
            currentDesc.textContent = currentCodeInfo.desc;
            currentWind.textContent = `Wind: ${Math.round(current.wind_speed_10m)} km/h`;
            
            // Hourly Forecast
            const hourly = weatherData.hourly;
            hourlyForecastContainer.innerHTML = ''; 
            for (let i = 0; i < hourly.time.length; i++) {
                const date = new Date(hourly.time[i]);
                if (date < locationTime && i < hourly.time.length -1) continue;
                
                const hour = date.getHours();
                const temp = Math.round(hourly.temperature_2m[i]);
                const precip = hourly.precipitation_probability[i];
                const codeInfo = weatherCodes[hourly.weather_code[i]] || { icon: "cloud" };

                const hourlyItem = document.createElement('div');
                hourlyItem.className = 'flex-shrink-0 flex flex-col items-center space-y-1 p-2 text-center w-20';
                hourlyItem.innerHTML = `
                    <p class="text-sm font-medium text-gray-600">${i === 0 ? 'Now' : hour + ':00'}</p>
                    <div class="w-8 h-8">${weatherIcons[codeInfo.icon]}</div>
                    <p class="font-bold text-lg">${temp}°</p>
                    <p class="text-xs text-blue-500">${precip}%</p>
                `;
                if(i < 24) hourlyForecastContainer.appendChild(hourlyItem);
            }

            // Daily Forecast
            const daily = weatherData.daily;
            dailyForecastContainer.innerHTML = '';
            for (let i = 0; i < 7; i++) {
                const date = new Date(daily.time[i]);
                 // Adjust for timezone to get the correct day name
                const localDate = new Date(date.valueOf() + date.getTimezoneOffset() * 60 * 1000 + weatherData.utc_offset_seconds * 1000);
                const dayName = i === 0 ? 'Today' : localDate.toLocaleDateString(undefined, { weekday: 'short' });

                const tempMax = Math.round(daily.temperature_2m_max[i]);
                const tempMin = Math.round(daily.temperature_2m_min[i]);
                const codeInfo = weatherCodes[daily.weather_code[i]] || { icon: "cloud" };

                const dailyItem = document.createElement('div');
                dailyItem.className = 'flex items-center justify-between p-2 rounded-lg hover:bg-gray-100 transition-colors';
                dailyItem.innerHTML = `
                    <p class="font-medium text-gray-700 w-1/4">${dayName}</p>
                    <div class="w-8 h-8 mx-4">${weatherIcons[codeInfo.icon]}</div>
                    <div class="flex items-center justify-end w-1/2">
                        <p class="font-semibold text-gray-800">${tempMax}°</p>
                        <div class="w-20 h-1 bg-gray-200 rounded-full mx-3">
                            <div class="h-1 bg-gradient-to-r from-cyan-400 to-blue-500 rounded-full" style="width: 100%;"></div>
                        </div>
                        <p class="font-medium text-gray-500">${tempMin}°</p>
                    </div>
                `;
                dailyForecastContainer.appendChild(dailyItem);
            }
        }

        function updateLocationsUI() {
            savedLocationsList.innerHTML = '';
            savedLocations.forEach((loc, index) => {
                const isActive = index === activeLocationIndex;
                const btnClasses = isActive 
                    ? 'bg-indigo-600 text-white' 
                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300';
                const locationBtn = document.createElement('div');
                locationBtn.className = `relative p-2 pl-4 pr-8 rounded-lg text-sm cursor-pointer transition-colors ${btnClasses}`;
                locationBtn.textContent = loc.name.split(',')[0]; // Show city name
                locationBtn.title = loc.name;
                locationBtn.dataset.index = index;
                locationBtn.addEventListener('click', () => switchLocation(index));

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'absolute top-1/2 right-1 -translate-y-1/2 w-6 h-6 flex items-center justify-center rounded-full hover:bg-red-500/50';
                deleteBtn.innerHTML = '&times;';
                deleteBtn.title = 'Delete location';
                deleteBtn.dataset.index = index;
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteLocation(index);
                });
                
                locationBtn.appendChild(deleteBtn);
                savedLocationsList.appendChild(locationBtn);
            });
        }

        // --- UI State Changers ---
        function showError(message) {
            loader.classList.add('hidden');
            content.classList.add('hidden');
            manualSearch.classList.add('hidden');
            errorMessage.classList.remove('hidden');
            errorText.textContent = message;
        }

        function showContent() {
            loader.classList.add('hidden');
            errorMessage.classList.add('hidden');
            manualSearch.classList.add('hidden');
            content.classList.remove('hidden');
            locationManager.classList.remove('hidden');
        }

        function showLoader() {
            errorMessage.classList.add('hidden');
            content.classList.add('hidden');
            manualSearch.classList.add('hidden');
            loader.classList.remove('hidden');
        }

        function showManualSearchUI(message = '') {
            loader.classList.add('hidden');
            content.classList.add('hidden');
            errorMessage.classList.add('hidden');
            manualSearch.classList.remove('hidden');
            manualSearchError.textContent = message;
        }

    </script>
</body>
</html>
