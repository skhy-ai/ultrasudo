<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="music-player">
        <h1>Music Player</h1>
        <div class="playlist">
            <h2>Playlist</h2>
            <ul id="playlist">
                <!-- Songs will be added here -->
            </ul>
        </div>
        <div class="controls">
            <button id="play-pause">Play</button>
            <button id="next">Next</button>
            <button id="previous">Previous</button>
            <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">
            <button id="record-btn" title="Record Audio" style="margin-left:10px; color:red;">● Rec</button>
        </div>
        <div class="radio-channels" style="margin-top: 20px; text-align: center;">
            <h3>Radio Channels</h3>
            <button class="radio-btn" data-url="http://stream.m4uradio.com:8230/stream">M4URadio (Dance)</button>
            <button class="radio-btn" data-url="http://stream.zeno.fm/f3wna168a2quv">Lofi Chill</button>
        </div>
        <div class="now-playing">
            <p id="now-playing">No song playing</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
