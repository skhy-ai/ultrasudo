<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <script src="../desktop/app-shell.js"></script>
    <script src="../desktop/file-helper.js"></script>
    <div class="container">
        <h1>Notebook</h1>
        <div class="document-header">
            <label for="document-title">Document Title</label>
            <input id="document-title" type="text" placeholder="Untitled document" autocomplete="off">
        </div>
        <div class="toolbar" role="toolbar" aria-label="Notebook formatting options">
            <div class="toolbar-group">
                <button type="button" data-command="undo" title="Undo" data-tooltip="Undo"><span
                        class="icon-text">↺</span></button>
                <button type="button" data-command="redo" title="Redo" data-tooltip="Redo"><span
                        class="icon-text">↻</span></button>
            </div>
            <div class="toolbar-group">
                <select id="format-block" title="Text Style" data-tooltip="Text Style">
                    <option value="P">Paragraph</option>
                    <option value="H1">Heading 1</option>
                    <option value="H2">Heading 2</option>
                    <option value="H3">Heading 3</option>
                    <option value="BLOCKQUOTE">Quote</option>
                    <option value="PRE">Code Block</option>
                </select>
                <select id="font-family" title="Font Family" data-tooltip="Font Family">
                    <option value="Arial" selected>Arial</option>
                    <option value="Times New Roman">Times New Roman</option>
                    <option value="Georgia">Georgia</option>
                    <option value="Verdana">Verdana</option>
                    <option value="Courier New">Courier New</option>
                </select>
                <select id="font-size" title="Font Size" data-tooltip="Font Size">
                    <option value="10">10</option>
                    <option value="12" selected>12</option>
                    <option value="14">14</option>
                    <option value="16">16</option>
                    <option value="18">18</option>
                    <option value="24">24</option>
                    <option value="32">32</option>
                </select>
            </div>
            <div class="toolbar-group">
                <button type="button" data-command="bold" title="Bold" data-tooltip="Bold"><span
                        class="icon-text">B</span></button>
                <button type="button" data-command="italic" title="Italic" data-tooltip="Italic"><span
                        class="icon-text">I</span></button>
                <button type="button" data-command="underline" title="Underline" data-tooltip="Underline"><span
                        class="icon-text">U</span></button>
                <button type="button" data-command="strikeThrough" title="Strikethrough"
                    data-tooltip="Strikethrough"><span class="icon-text">S̶</span></button>
                <button type="button" data-command="superscript" title="Superscript" data-tooltip="Superscript"><span
                        class="icon-text">x³</span></button>
                <button type="button" data-command="subscript" title="Subscript" data-tooltip="Subscript"><span
                        class="icon-text">x₂</span></button>
                <label class="color-control" title="Text Color" data-tooltip="Text Color">
                    <span class="icon-text">A</span>
                    <input id="font-color" type="color" value="#000000" aria-label="Select text color" />
                </label>
                <label class="color-control" title="Highlight" data-tooltip="Highlight">
                    <span class="icon-text">HL</span>
                    <input id="highlight-color" type="color" value="#ffff00" aria-label="Select highlight color" />
                </label>
            </div>
            <div class="toolbar-group">
                <button type="button" data-command="justifyLeft" title="Align Left" data-tooltip="Align Left"><span
                        class="icon-text">L</span></button>
                <button type="button" data-command="justifyCenter" title="Align Center"
                    data-tooltip="Align Center"><span class="icon-text">C</span></button>
                <button type="button" data-command="justifyRight" title="Align Right" data-tooltip="Align Right"><span
                        class="icon-text">R</span></button>
                <button type="button" data-command="justifyFull" title="Justify" data-tooltip="Justify"><span
                        class="icon-text">J</span></button>
                <button type="button" data-command="insertUnorderedList" title="Bulleted List"
                    data-tooltip="Bulleted List"><span class="icon-text">•</span></button>
                <button type="button" data-command="insertOrderedList" title="Numbered List"
                    data-tooltip="Numbered List"><span class="icon-text">1.</span></button>
                <button type="button" data-command="indent" title="Increase Indent" data-tooltip="Increase Indent"><span
                        class="icon-text">→</span></button>
                <button type="button" data-command="outdent" title="Decrease Indent"
                    data-tooltip="Decrease Indent"><span class="icon-text">←</span></button>
                <button type="button" data-command="insertHorizontalRule" title="Horizontal Rule"
                    data-tooltip="Horizontal Rule"><span class="icon-text">―</span></button>
            </div>
            <div class="toolbar-group">
                <button type="button" data-action="createLink" title="Insert Link" data-tooltip="Insert Link"><span
                        class="icon-text">🔗</span></button>
                <button type="button" data-command="unlink" title="Remove Link" data-tooltip="Remove Link"><span
                        class="icon-text">✕</span></button>
                <button type="button" data-action="insertImageUrl" title="Insert Image from URL"
                    data-tooltip="Insert Image from URL"><span class="icon-text">🖼</span></button>
                <button type="button" data-action="insertImageUpload" title="Insert Image from Device"
                    data-tooltip="Insert Image from Device"><span class="icon-text">📁</span></button>
                <button type="button" data-action="insertTable" title="Insert Table" data-tooltip="Insert Table"><span
                        class="icon-text">╬</span></button>
                <button type="button" data-action="clearFormatting" title="Clear Formatting"
                    data-tooltip="Clear Formatting"><span class="icon-text">⌫</span></button>
                <button type="button" data-action="insertPageBreak" title="Insert Page Break"
                    data-tooltip="Insert Page Break"><span class="icon-text">PB</span></button>
            </div>
            <div class="toolbar-group margin-group">
                <button type="button" id="margin-menu-button" class="icon-button" title="Page Margins"
                    data-tooltip="Page Margins" aria-haspopup="true" aria-expanded="false">
                    <svg class="icon-svg" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" />
                        <line x1="7" y1="3" x2="7" y2="21" stroke="currentColor" stroke-width="1" />
                        <line x1="17" y1="3" x2="17" y2="21" stroke="currentColor" stroke-width="1" />
                        <line x1="3" y1="7" x2="21" y2="7" stroke="currentColor" stroke-width="1" />
                        <line x1="3" y1="17" x2="21" y2="17" stroke="currentColor" stroke-width="1" />
                    </svg>
                </button>
                <div id="margin-menu" class="dropdown-panel" role="dialog" aria-label="Margin controls"
                    aria-hidden="true">
                    <div class="dropdown-row">
                        <label for="margin-unit">Unit</label>
                        <select id="margin-unit">
                            <option value="cm" selected>cm</option>
                            <option value="in">inches</option>
                        </select>
                    </div>
                    <div class="dropdown-row">
                        <label for="page-size">Page</label>
                        <select id="page-size">
                            <option value="letter" selected>US Letter</option>
                            <option value="a4">A4</option>
                        </select>
                        <select id="page-orientation">
                            <option value="portrait" selected>Portrait</option>
                            <option value="landscape">Landscape</option>
                        </select>
                    </div>
                    <div class="dropdown-grid margin-controls">
                        <label for="margin-top">Top</label>
                        <input id="margin-top" data-margin="top" type="number" step="0.1" min="0" value="2">
                        <label for="margin-right">Right</label>
                        <input id="margin-right" data-margin="right" type="number" step="0.1" min="0" value="2">
                        <label for="margin-bottom">Bottom</label>
                        <input id="margin-bottom" data-margin="bottom" type="number" step="0.1" min="0" value="2">
                        <label for="margin-left">Left</label>
                        <input id="margin-left" data-margin="left" type="number" step="0.1" min="0" value="2">
                    </div>
                    <button type="button" id="reset-margins" class="secondary-button">Reset Margins</button>
                </div>
            </div>
            <div class="toolbar-group toolbar-group-right">
                <button type="button" id="download-docx" title="Download as DOCX" data-tooltip="Download as DOCX"><span
                        class="icon-text">DOCX</span></button>
                <button type="button" id="download-pdf" title="Download as PDF" data-tooltip="Download as PDF"><span
                        class="icon-text">PDF</span></button>
            </div>
        </div>
        <div class="editor-shell">
            <div class="ruler horizontal" aria-hidden="true"></div>
            <div class="ruler vertical" aria-hidden="true"></div>
            <div class="margin-guide margin-guide-top" aria-hidden="true"></div>
            <div class="margin-guide margin-guide-right" aria-hidden="true"></div>
            <div class="margin-guide margin-guide-bottom" aria-hidden="true"></div>
            <div class="margin-guide margin-guide-left" aria-hidden="true"></div>
            <div id="editor" contenteditable="true" aria-label="Document editor"></div>
        </div>
        <input type="file" id="image-upload" accept="image/*" hidden>
        <div id="image-properties-panel" class="image-properties-panel hidden" role="dialog" aria-hidden="true"
            aria-label="Image properties">
            <div class="panel-header">
                <span>Image Properties</span>
                <button type="button" id="close-image-panel" title="Close" data-tooltip="Close">×</button>
            </div>
            <div class="panel-body">
                <label for="image-layout">Layout</label>
                <select id="image-layout">
                    <option value="inline">Inline</option>
                    <option value="block">Break text</option>
                    <option value="center">Center</option>
                    <option value="float-left">Float left</option>
                    <option value="float-right">Float right</option>
                </select>
                <label for="image-width">Image Width</label>
                <input id="image-width" type="range" min="10" max="100" value="100">
                <label for="image-brightness">Brightness</label>
                <input id="image-brightness" type="range" min="0" max="200" value="100">
                <label for="image-saturation">Saturation</label>
                <input id="image-saturation" type="range" min="0" max="200" value="100">
                <label for="image-hue">Color Tone</label>
                <input id="image-hue" type="range" min="0" max="360" value="0">
            </div>
        </div>

        <div id="table-properties-panel" class="image-properties-panel hidden" role="dialog" aria-hidden="true"
            aria-label="Table properties">
            <div class="panel-header">
                <span>Table Properties</span>
                <button type="button" id="close-table-panel" title="Close" data-tooltip="Close">×</button>
            </div>
            <div class="panel-body">
                <label for="table-border-style">Border Style</label>
                <select id="table-border-style">
                    <option value="solid">Solid</option>
                    <option value="dotted">Dotted</option>
                    <option value="dashed">Dashed</option>
                    <option value="double">Double</option>
                    <option value="none">None</option>
                </select>
                <label for="table-border-width">Border Thickness</label>
                <input id="table-border-width" type="range" min="1" max="10" value="1">
                <label for="table-border-color">Border Color</label>
                <input id="table-border-color" type="color" value="#666666"
                    style="width: 100%; border-radius: 6px; height: 32px;" aria-label="Select table border color">
            </div>
        </div>
    </div>
    <!-- Local export libraries with CDN fallback -->
    <script src="vendor/html-docx.js"></script>
    <script>if (!window.htmlDocx) { var s = document.createElement('script'); s.src = 'https://unpkg.com/html-docx-js/dist/html-docx.js'; document.head.appendChild(s); }</script>
    <script src="vendor/html2pdf.bundle.min.js"></script>
    <script>if (typeof html2pdf !== 'function') { var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js'; document.head.appendChild(s); }</script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppShell) {
                AppShell.init({ appId: 'notebook', title: 'Notebook', showSave: true, showOpen: true });
                AppShell.onSave(async () => {
                    const html = window.Notebook ? window.Notebook.serialize() : (document.getElementById('editor').innerHTML || '');
                    await FileHelper.saveText('notes.html', html);
                });
                AppShell.onOpen(async () => {
                    const res = await FileHelper.openText();
                    if (res.ok) {
                        if (window.Notebook) {
                            window.Notebook.deserialize(res.content || '');
                        } else {
                            document.getElementById('editor').innerHTML = res.content || '';
                        }
                    }
                });
            }
        });
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppShell) AppShell.init({ appId: 'notebook', title: 'Notebook', showSave: true, showOpen: true });
        });
    </script>
</body>

</html>
