<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Python IDE</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
</head>

<body>
  <script src="../desktop/app-shell.js"></script>
  <script src="../desktop/file-helper.js"></script>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-section">
        <div class="section-header">
          <h3>Projects</h3>
          <button id="new-notebook-btn" title="New Notebook">+</button>
        </div>
        <div id="notebooks-list" class="item-list">
          <div class="loading">Loading projects...</div>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="section-header">
          <h3>Packages</h3>
          <button id="toggle-pkg-search" title="Search Packages"><i class="fas fa-search"></i></button>
        </div>
        <div id="pkg-manager-container" class="item-list">
          <div id="installed-pkgs" class="pkgs-container"></div>
        </div>
      </div>

      <div class="sidebar-status">
        <span id="py-status">Pyodide: Loading...</span>
      </div>
    </aside>

    <main class="main-content">
      <header class="workspace-header">
        <div class="notebook-info">
          <input id="notebook-title" type="text" placeholder="Untitled Project" class="title-input">
        </div>
        <div class="actions">
          <button id="run-all-btn" class="primary-btn"><i class="fas fa-play"></i> Run All</button>
          <button id="add-cell-btn" class="secondary-btn"><i class="fas fa-plus"></i> Add Cell</button>
        </div>
      </header>

      <div id="notebook-container" class="notebook-container">
        <!-- Cells will be rendered here -->
        <div class="welcome-screen">
          <i class="fas fa-terminal"></i>
          <p>Select a project or create a new one to start coding.</p>
        </div>
      </div>
    </main>

    <!-- Floating Package Search (Modal/Panel) -->
    <div id="pkg-search-panel" class="floating-panel hidden">
      <div class="panel-header">
        <h4>Install Packages</h4>
        <button id="close-pkg-panel">&times;</button>
      </div>
      <div class="panel-body">
        <div class="search-input-wrap">
          <input type="text" id="pkg-search-input" placeholder="Search PyPI (e.g. numpy, pandas)...">
          <button id="do-pkg-search">Find</button>
        </div>
        <div id="pkg-search-results"></div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.AppShell) {
        AppShell.init({ appId: 'python-IDE', title: 'Python IDE', showSave: true, showOpen: true });
        AppShell.onSave(async () => {
          if (window.PyNotebook?.serialize) {
            const json = window.PyNotebook.serialize();
            await FileHelper.saveText('notebook.json', JSON.stringify(json, null, 2));
          }
        });
        AppShell.onOpen(async () => {
          if (window.PyNotebook?.load) {
            const res = await FileHelper.openText();
            if (res.ok) {
              try { window.PyNotebook.load(JSON.parse(res.content)); } catch (e) { alert('Invalid notebook JSON'); }
            }
          }
        });
      }
    });
  </script>
</body>

</html>
