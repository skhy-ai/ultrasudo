<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultrasudo - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <svg viewBox="0 0 100 100" width="48" height="48">
                    <circle cx="50" cy="50" r="45" fill="none" stroke="url(#blueGrad)" stroke-width="8" />
                    <path d="M 30 70 L 50 20 L 70 70" fill="none" stroke="#fff" stroke-width="8"
                        stroke-linejoin="round" />
                    <defs>
                        <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#3b82f6" />
                            <stop offset="100%" stop-color="#8b5cf6" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
            <h1>Ultrasudo</h1>
            <p class="subtitle">Secure, private desktop environment</p>

            <form id="auth-form">
                <div class="input-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required placeholder="you@example.com">
                </div>
                <div class="input-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>

                <div id="error-message" class="error-message"></div>

                <div class="actions">
                    <button type="submit" id="signin-btn" class="primary-btn">Sign In</button>
                    <button type="button" id="signup-btn" class="secondary-btn">Create Account</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="login.js"></script>
</body>

</html>
