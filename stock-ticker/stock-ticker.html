<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Ticker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
  <body>
    <script src="../desktop/app-shell.js"></script>
    <script src="../desktop/data-manager.js"></script>
    <div class="container">
      <h1><i class="fas fa-chart-line"></i> Stock Ticker</h1>
      <div class="settings">
            <input type="text" id="api-key-input" placeholder="Enter your Alpha Vantage API Key">
            <button id="save-api-key">Save Key</button>
            <p><a href="https://www.alphavantage.co/support/#api-key" target="_blank">Get a free API key from Alpha Vantage</a></p>
        </div>
        <div class="input-form">
            <input type="text" id="ticker-input" placeholder="e.g., AAPL, GOOGL">
            <button id="add-ticker-btn">Add Ticker</button>
        </div>
        <div class="form-group" style="margin-bottom: 16px; position: relative;">
            <label for="company-search">Search Company:</label>
            <input type="text" id="company-search" class="form-control" placeholder="Type to search companies..." aria-label="Search companies">
            <div id="search-results" class="search-results" role="listbox" aria-label="Search results"></div>
        </div>
        <div id="tickers-grid" class="tickers-grid"></div>
        <p style="margin-top:12px; font-size: 12px; color:#666;">
          Historical prices use the local Yahoo Finance service at <code>http://127.0.0.1:5005</code>. Start it with:
          <code>python service_manager.py start stock-ticker --port 5005</code>
          Live quotes still use Alpha Vantage.
        </p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.AppShell) AppShell.init({ appId: 'stock-ticker', title: 'Stock Ticker', showSave: false, showOpen: false });
      });
    </script>
  </body>
</html>
