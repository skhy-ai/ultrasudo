<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skand Browser</title>
    <link rel="stylesheet" href="browser.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <div class="browser-header">
        <div class="logo">SKAND</div>
        <div class="nav-controls">
            <button id="btn-back" title="Go Back"><i class="fas fa-arrow-left"></i></button>
            <button id="btn-forward" title="Go Forward"><i class="fas fa-arrow-right"></i></button>
            <button id="btn-reload" title="Reload"><i class="fas fa-redo"></i></button>
            <button id="btn-home" title="Home"><i class="fas fa-home"></i></button>
        </div>

        <div class="url-bar-container">
            <i class="fas fa-lock security-icon" id="security-icon"></i>
            <input type="text" id="url-input" placeholder="Search or enter web address"
                value="http://localhost:8000/desktop/desktop.html" spellcheck="false">
            <button id="btn-bookmark" title="Bookmark this page"><i class="far fa-star"></i></button>
        </div>

        <div class="menu-controls">
            <button id="btn-hamburger" title="Browser Menu"><i class="fas fa-bars"></i></button>
        </div>
    </div>

    <div class="main-body">
        <div class="global-sidebar" id="global-sidebar">
            <div class="sidebar-header">
                <button id="btn-sidebar-back" class="close-btn hidden" title="Back"><i class="fas fa-arrow-left"></i></button>
                <h3 id="sidebar-title">Browser Menu</h3>
                <button id="close-sidebar" class="close-btn"><i class="fas fa-times"></i></button>
            </div>
            
            <!-- Main Menu View -->
            <div class="sidebar-content" id="view-menu">
                <button class="sidebar-nav-btn" data-target="view-settings"><i class="fas fa-cog"></i> Settings</button>
                <button class="sidebar-nav-btn" data-target="view-bookmarks"><i class="fas fa-book"></i> Bookmarks</button>
                <button class="sidebar-nav-btn" data-target="view-history"><i class="fas fa-history"></i> History</button>
                <button class="sidebar-nav-btn" data-target="view-passwords"><i class="fas fa-key"></i> Passwords</button>
            </div>
            
            <!-- Settings View -->
            <div class="sidebar-content hidden" id="view-settings">
                <div class="settings-group">
                    <h4>Browser Settings</h4>
                    <label class="setting-item">
                        <span>Search Engine</span>
                        <select id="setting-search-engine" class="modern-select">
                            <option value="google">Google</option>
                            <option value="duckduckgo">DuckDuckGo</option>
                        </select>
                    </label>
                    <label class="setting-item">
                        <span>Tracking Protection</span>
                        <input type="checkbox" id="setting-tracking" checked>
                    </label>
                    <label class="setting-item">
                        <span>Dark Mode Sync</span>
                        <input type="checkbox" id="setting-darkmode" checked>
                    </label>
                    <div class="setting-item action-item" id="btn-clear-data">
                        <span>Clear Browsing Data</span>
                        <i class="fas fa-trash"></i>
                    </div>
                    <label class="setting-item">
                        <span>WOT Script Blocker</span>
                        <input type="checkbox" id="setting-wot-script-blocker" checked>
                    </label>
                    <label class="setting-item">
                        <span>Developer Tools</span>
                        <input type="checkbox" id="setting-devtools">
                    </label>
                </div>
            </div>

            <!-- History View -->
            <div class="sidebar-content hidden" id="view-history">
                <div id="history-list"><div class="loading">Loading...</div></div>
            </div>

            <!-- Bookmarks View -->
            <div class="sidebar-content hidden" id="view-bookmarks">
                <div id="bookmarks-list"><div class="loading">Loading...</div></div>
            </div>

            <!-- Passwords View -->
            <div class="sidebar-content hidden" id="view-passwords">
                <div class="add-password-form">
                    <input type="text" id="pass-site" placeholder="Website URL">
                    <input type="text" id="pass-user" placeholder="Username">
                    <input type="password" id="pass-pass" placeholder="Password">
                    <button id="btn-save-password">Save Password</button>
                </div>
                <div id="passwords-list" style="margin-top:15px;"><div class="loading">Loading...</div></div>
            </div>
        </div>

        <div class="main-column">
            <div class="tabs-bar">
                <div id="tabs-container" class="tabs-container">
                    <!-- dynamic tabs go here -->
                </div>
                <button id="btn-new-tab" class="btn-new-tab" title="New Tab"><i class="fas fa-plus"></i></button>
            </div>
            
            <div class="browser-content" id="webviews-container">
                <!-- iframes go here dynamically -->
            </div>
        </div>
    </div>

    <!-- Apps Sidebar on Right -->
    <div class="apps-sidebar" id="apps-sidebar">
        <div id="apps-list-container"></div>
    </div>

    <script src="../desktop/app-classifier.js"></script>
    <script src="browser.js"></script>
</body>

</html>
