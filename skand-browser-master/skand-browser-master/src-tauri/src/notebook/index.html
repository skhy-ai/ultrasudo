<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    
    <script src="../desktop/file-helper.js"></script>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>My Notes</h2>
                <button id="new-note-btn" title="New Note">+</button>
            </div>
            <div id="notes-list" class="notes-list">
                <!-- Notes will be populated here -->
                <div class="notes-loading">Loading notes...</div>
            </div>
            <div class="sidebar-footer">
                <div id="stats-display">0 words</div>
            </div>
        </aside>

        <main class="main-content">
            <div class="toolbar" role="toolbar" aria-label="Formatting options">
                <div class="toolbar-group">
                    <button type="button" data-command="undo" title="Undo">↺</button>
                    <button type="button" data-command="redo" title="Redo">↻</button>
                </div>

                <div class="toolbar-group">
                    <select id="format-block" title="Style">
                        <option value="P">Paragraph</option>
                        <option value="H1">Heading 1</option>
                        <option value="H2">Heading 2</option>
                        <option value="H3">Heading 3</option>
                        <option value="BLOCKQUOTE">Quote</option>
                    </select>
                </div>

                <div class="toolbar-group">
                    <button type="button" data-command="bold" title="Bold">B</button>
                    <button type="button" data-command="italic" title="Italic">I</button>
                    <button type="button" data-command="underline" title="Underline">U</button>
                    <label class="color-control" title="Color">
                        <span>A</span>
                        <input id="font-color" type="color" value="#000000" />
                    </label>
                </div>

                <div class="toolbar-group">
                    <button type="button" data-command="justifyLeft" title="Left">L</button>
                    <button type="button" data-command="justifyCenter" title="Center">C</button>
                    <button type="button" data-command="insertUnorderedList" title="Bullets">•</button>
                    <button type="button" data-command="insertOrderedList" title="Numbers">1.</button>
                </div>

                <div class="toolbar-group">
                    <button type="button" data-action="createLink" title="Link">🔗</button>
                    <button type="button" data-action="insertImageUpload" title="Image">🖼</button>
                    <button type="button" data-action="insertTable" title="Table">╬</button>
                </div>

                <div class="toolbar-group right">
                    <button type="button" id="download-docx" title="Export DOCX">DOCX</button>
                    <button type="button" id="download-pdf" title="Export PDF">PDF</button>
                </div>
            </div>

            <div class="editor-container">
                <input id="document-title" type="text" placeholder="Untitled document" class="editor-title">
                <div id="editor" contenteditable="true" spellcheck="true"></div>
            </div>
        </main>
    </div>
    <input type="file" id="image-upload" accept="image/*" hidden>
    <div id="image-properties-panel" class="image-properties-panel hidden" role="dialog" aria-hidden="true"
        aria-label="Image properties">
        <div class="panel-header">
            <span>Image Properties</span>
            <button type="button" id="close-image-panel" title="Close" data-tooltip="Close">×</button>
        </div>
        <div class="panel-body">
            <label for="image-layout">Layout</label>
            <select id="image-layout">
                <option value="inline">Inline</option>
                <option value="block">Break text</option>
                <option value="center">Center</option>
                <option value="float-left">Float left</option>
                <option value="float-right">Float right</option>
            </select>
            <label for="image-width">Image Width</label>
            <input id="image-width" type="range" min="10" max="100" value="100">
            <label for="image-brightness">Brightness</label>
            <input id="image-brightness" type="range" min="0" max="200" value="100">
            <label for="image-saturation">Saturation</label>
            <input id="image-saturation" type="range" min="0" max="200" value="100">
            <label for="image-hue">Color Tone</label>
            <input id="image-hue" type="range" min="0" max="360" value="0">
        </div>
    </div>
    </div>
    <!-- Local export libraries with CDN fallback -->
    <script src="vendor/html-docx.js"></script>
    <script>if (!window.htmlDocx) { var s = document.createElement('script'); s.src = 'https://unpkg.com/html-docx-js/dist/html-docx.js'; document.head.appendChild(s); }</script>
    <script src="vendor/html2pdf.bundle.min.js"></script>
    <script>if (typeof html2pdf !== 'function') { var s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.9.2/html2pdf.bundle.min.js'; document.head.appendChild(s); }</script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppShell) {
                
                AppShell.onSave(async () => {
                    const html = window.Notebook ? window.Notebook.serialize() : (document.getElementById('editor').innerHTML || '');
                    await FileHelper.saveText('notes.html', html);
                });
                AppShell.onOpen(async () => {
                    const res = await FileHelper.openText();
                    if (res.ok) {
                        if (window.Notebook) {
                            window.Notebook.deserialize(res.content || '');
                        } else {
                            document.getElementById('editor').innerHTML = res.content || '';
                        }
                    }
                });
            }
        });
    </script>
    
</body>

</html>
