<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patent Researcher</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script src="../desktop/app-shell.js"></script>
  <script src="../desktop/data-manager.js"></script>
  <div class="container">
    <h1>Patent Researcher</h1>
    <p>Enter a synopsis. The app uses OpenAI/Gemini to craft search queries and returns relevant patent links.</p>

    <div class="provider-row">
      <label>
        Provider
        <select id="provider">
          <option value="openai">OpenAI</option>
          <option value="gemini">Gemini</option>
        </select>
      </label>
      <label class="flex1">
        Model
        <input id="model" type="text" placeholder="leave blank to use saved default" />
      </label>
      <button id="test-api">Test API</button>
      <span id="api-status" class="status"></span>
    </div>

    <label>Synopsis</label>
    <textarea id="synopsis" rows="5" placeholder="Describe the invention or area..."></textarea>
    <div class="actions">
      <button id="search">Search Patents</button>
    </div>

    <div id="results" class="results"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
