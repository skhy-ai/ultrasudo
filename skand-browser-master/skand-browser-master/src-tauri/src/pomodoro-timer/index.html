<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../vendor/fontawesome/css/all.min.css">
</head>

<body>
  <script src="../desktop/app-shell.js"></script>
  <script src="../desktop/data-manager.js"></script>
  <script src="../desktop/file-helper.js"></script>

  <div class="pomodoro-container">
    <h1><i class="fas fa-hourglass-half"></i> POMODORO</h1>

    <div class="timer-wrapper">
      <svg class="timer-svg" viewBox="0 0 100 100">
        <circle class="timer-bg" cx="50" cy="50" r="45"></circle>
        <circle id="progress" class="timer-progress" cx="50" cy="50" r="45" stroke-dasharray="282.7"
          stroke-dashoffset="0"></circle>
      </svg>
      <div class="timer-display" id="display">25:00</div>
    </div>

    <div class="status" id="status">Ready to focus?</div>

    <div class="controls">
      <button id="start" title="Start Timer"><i class="fas fa-play"></i> Start</button>
      <button id="pause" title="Pause Timer"><i class="fas fa-pause"></i> Pause</button>
      <button id="reset" title="Reset Session"><i class="fas fa-undo"></i></button>
      <button id="skip" title="Skip Session"><i class="fas fa-forward"></i></button>
    </div>

    <div class="settings">
      <div class="settings-group">
        <label for="work-time">Work</label>
        <input type="number" id="work-time" value="25" min="1" max="60">
      </div>
      <div class="settings-group">
        <label for="break-time">Break</label>
        <input type="number" id="break-time" value="5" min="1" max="30">
      </div>
      <div class="settings-group">
        <label for="long-break-time">Long Break</label>
        <input type="number" id="long-break-time" value="15" min="1" max="60">
      </div>
      <div class="settings-group">
        <label for="cycles">Cycles</label>
        <input type="number" id="cycles" value="4" min="1" max="10">
      </div>
    </div>
  </div>

  <audio id="notification-sound" src="../assets/notification.mp3" preload="auto"></audio>

  <script src="script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.AppShell) AppShell.init({ appId: 'pomodoro-timer', title: 'Pomodoro Timer' });
    });
  </script>
</body>

</html>
