<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    
    <script src="../desktop/data-manager.js"></script>
    <div class="container">
        <h1><i class="fas fa-code"></i> Code Generator</h1>
        <p>Multi-provider generator with staged flow: Prompt → Testcases → Validate → Generate.</p>

        <div class="provider-row">
          <label>
            Provider
            <select id="provider">
              <option value="openai">OpenAI</option>
              <option value="gemini">Gemini</option>
              <option value="lmstudio">LMStudio (local)</option>
            </select>
          </label>
          <label class="flex1">
            Model
            <input id="model" type="text" placeholder="leave blank to use saved default" />
          </label>
          <button id="test-api">Test API</button>
          <span id="api-status" class="status"></span>
        </div>

        <section class="stage">
          <h2>1. Prompt</h2>
          <label for="prompt-input">Describe the application you want to build:</label>
          <textarea id="prompt-input" rows="4" placeholder="e.g., A simple todo list with add/edit/delete and localStorage."></textarea>
          <div class="actions">
            <button id="gen-tests">Generate Testcases</button>
          </div>
        </section>

        <section class="stage">
          <h2>2. Testcases</h2>
          <div id="tests-container" class="tests"></div>
          <div class="actions">
            <button id="accept-tests">Accept Selected Testcases</button>
            <button id="regen-tests" class="secondary">Regenerate</button>
          </div>
        </section>

        <section class="stage">
          <h2>3. Generate Code</h2>
          <div class="file-row">
            <label class="flex1">Filename to generate<input id="filename" type="text" placeholder="e.g., index.html"/></label>
            <button id="generate-btn">Generate File</button>
          </div>
          <div class="response-container">
            <h3>Generated Content</h3>
            <pre><code id="response-output"></code></pre>
          </div>
        </section>
    </div>
    <script src="script.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.AppShell) {
          
        }
      });
    </script>
</body>
</html>
