<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Explorer</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "./lib/three.module.js",
            "three/addons/controls/": "./lib/addons/controls/",
            "three/addons/renderers/": "./lib/addons/renderers/"
        }
    }
    </script>
    
</head>

<body>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.AppShell) {
                
            }
        });
    </script>
    <div id="loading">
        <div class="loading-content">
            <div class="loading-bar">
                <div class="loading-progress" id="loadingProgress"></div>
            </div>
        </div>
    </div>

    <div id="info">
        <strong>Cosmic Explorer</strong><br>
        <div style="margin-top: 8px; font-size: 13px; opacity: 0.8;">
            <div>🖱️ Left-click + drag: Rotate view</div>
            <div>🖱️ Right-click + drag: Pan</div>
            <div>🖱️ Scroll: Zoom in/out</div>
            <div>🌠 Click on objects for details</div>
        </div>
        <div id="tooltip">Hover over an object for details.</div>
    </div>

    <div id="controls">
        <button class="control-btn active" id="viewSolarSystem">Solar System</button>
        <button class="control-btn" id="openLokaSimulator">Hindu Cosmology</button>
        <button class="control-btn" id="viewStars">Stars</button>
        <span style="margin-left:12px; opacity:0.8; font-size:13px;">Scale:</span>
        <button class="control-btn" id="scaleEducational">Educational</button>
        <button class="control-btn" id="scaleRealistic">Realistic</button>
    </div>

    <script type="module" src="main.js"></script>
</body>

</html>
