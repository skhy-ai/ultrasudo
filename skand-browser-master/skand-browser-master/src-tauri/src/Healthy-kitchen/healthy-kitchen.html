<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Low-Glycemic Recipe Guide</title>
    
    <script src="../desktop/data-manager.js"></script>
    <script src="../desktop/file-helper.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8;
        }

        .modal {
            display: none;
            transition: opacity 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        /* Custom scrollbar for better aesthetics */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* Animation for recipe cards */
        .recipe-card {
            transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }

        .recipe-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>

<body class="antialiased text-gray-800">

    <!-- Main Container -->
    <div id="main-content" class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-4xl md:text-5xl font-bold text-teal-700">Mindful Kitchen</h1>
            <p class="text-lg text-gray-600 mt-2">Deliciously healthy low-glycemic recipes for every palate.</p>
        </header>

        <!-- Filters Section -->
        <div id="filters" class="bg-white p-6 rounded-xl shadow-md mb-8 sticky top-4 z-10">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Cuisine Filter -->
                <div>
                    <label for="cuisine-filter" class="block text-sm font-medium text-gray-700 mb-2">Cuisine</label>
                    <select id="cuisine-filter"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500">
                        <option value="all">All Cuisines</option>
                        <option value="Mediterranean">Mediterranean</option>
                        <option value="Indian">Indian</option>
                        <option value="Mexican">Mexican</option>
                        <option value="Asian">Asian</option>
                    </select>
                </div>
                <!-- Dietary Restrictions Filter -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Dietary Needs</label>
                    <div id="dietary-filters" class="flex flex-wrap gap-4 items-center">
                        <label class="inline-flex items-center">
                            <input type="checkbox" value="no-meat" class="form-checkbox h-5 w-5 text-teal-600 rounded">
                            <span class="ml-2 text-gray-700">No Meat</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" value="no-egg" class="form-checkbox h-5 w-5 text-teal-600 rounded">
                            <span class="ml-2 text-gray-700">No Egg</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" value="vegan" class="form-checkbox h-5 w-5 text-teal-600 rounded">
                            <span class="ml-2 text-gray-700">Vegan</span>
                        </label>
                        <label class="inline-flex items-center">
                            <input type="checkbox" value="gluten-free"
                                class="form-checkbox h-5 w-5 text-teal-600 rounded">
                            <span class="ml-2 text-gray-700">Gluten-Free</span>
                        </label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Recipe Grid -->
        <main id="recipe-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Recipe cards will be injected here by JavaScript -->
        </main>
        <p id="no-results" class="text-center text-gray-500 mt-8 text-lg hidden">No recipes match your criteria. Try
            adjusting your filters!</p>
    </div>

    <!-- Recipe Detail Modal -->
    <div id="recipe-modal" class="modal fixed inset-0 bg-black bg-opacity-60 items-center justify-center p-4 z-40">
        <div id="recipe-modal-content"
            class="bg-white rounded-2xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto relative transform transition-all opacity-0 translate-y-4">
            <!-- Content will be injected here -->
        </div>
    </div>

    <!-- Cooking Mode Modal -->
    <div id="cooking-modal"
        class="modal fixed inset-0 bg-gray-900 bg-opacity-80 backdrop-blur-sm items-center justify-center p-4 z-50">
        <div id="cooking-modal-content"
            class="bg-white text-center p-6 md:p-10 rounded-2xl shadow-2xl w-full max-w-2xl transform transition-all opacity-0 scale-95">
            <!-- Content will be injected here -->
        </div>
    </div>

            },
            {

                ingredients: [

                    { name: "Olive Oil", amount: "3 tbsp", image: "https://placehold.co/100x100/4FC3F7/000000?text=Olive+Oil" },

            },
            {
                id: 12,
                name: "Thai Green Curry",
                cuisine: "Asian",
                tags: ["no-meat", "no-egg", "vegan", "gluten-free"],
                image: "https://images.unsplash.com/photo-1455619452474-d2be8b1e70cd?auto=format&fit=crop&q=80&w=800",
                ingredients: [
                    { name: "Coconut Milk", amount: "1 can", image: "https://placehold.co/100x100/4DB6AC/000000?text=Coconut+Milk" },
                    { name: "Green Curry Paste", amount: "2 tbsp", image: "https://placehold.co/100x100/4DB6AC/000000?text=Curry+Paste" },
                    { name: "Broccoli", amount: "1 cup florets", image: "https://placehold.co/100x100/4DB6AC/000000?text=Broccoli" },
                    { name: "Bell Pepper", amount: "1, sliced", image: "https://placehold.co/100x100/4DB6AC/000000?text=Pepper" },
                    { name: "Firm Tofu", amount: "1/2 block, cubed", image: "https://placehold.co/100x100/4DB6AC/000000?text=Tofu" },
                    { name: "Thai Basil", amount: "1/4 cup", image: "https://placehold.co/100x100/4DB6AC/000000?text=Basil" },
                ],
                steps: [
                    { text: "Heat a tablespoon of coconut oil in a large pan over medium heat. Add the green curry paste and cook for one minute until fragrant.", image: "https://placehold.co/400x300/26A69A/FFFFFF?text=Fry+Paste" },
                    { text: "Pour in the coconut milk and whisk until the paste is fully dissolved. Bring to a gentle simmer.", image: "https://placehold.co/400x300/4DB6AC/FFFFFF?text=Add+Coconut+Milk" },
                    { text: "Add the broccoli, bell pepper, and tofu to the curry. Stir to combine.", image: "https://placehold.co/400x300/80CBC4/FFFFFF?text=Add+Veggies" },
                    { text: "Simmer for 7-10 minutes, until the vegetables are tender-crisp. Don't overcook them.", image: "https://placehold.co/400x300/4DB6AC/FFFFFF?text=Simmer+Curry" },
                    { text: "Remove from heat and stir in the fresh Thai basil. Serve the curry hot, ideally with brown rice or quinoa.", image: "https://placehold.co/400x300/26A69A/FFFFFF?text=Serve" },
                ]
            }
        ];

        // --- DOM ELEMENTS ---
        const recipeGrid = document.getElementById('recipe-grid');
        const noResults = document.getElementById('no-results');
        const cuisineFilter = document.getElementById('cuisine-filter');
        const dietaryFilters = document.getElementById('dietary-filters');
        const recipeModal = document.getElementById('recipe-modal');
        const recipeModalContent = document.getElementById('recipe-modal-content');
        const cookingModal = document.getElementById('cooking-modal');
        const cookingModalContent = document.getElementById('cooking-modal-content');

        // --- AUDIO & SPEECH ---
        let audioContext, oscillator, gainNode;
        let currentUtterance = null;
        let availableVoices = [];
        let currentRecipeSteps = [];
        let currentStepIndex = 0;

        function populateVoiceList() {
            if (typeof speechSynthesis === 'undefined') return;

            const allVoices = speechSynthesis.getVoices();
            const preferredVoiceKeywords = [
                'google', 'microsoft', 'apple', // OS/Browser specific high-quality voices
                'zira', 'david', 'mark', // Common Microsoft voices
                'samantha', 'daniel', 'karen', // Common Apple/iOS voices
                'natural' // Often indicates higher quality
            ];

            // Filter to include only local, English voices that match keywords
            availableVoices = allVoices.filter(voice => {
                const name = voice.name.toLowerCase();
                const lang = voice.lang.toLowerCase();
                // We want English voices that are locally processed for reliability
                return lang.startsWith('en-') && voice.localService && preferredVoiceKeywords.some(keyword => name.includes(keyword));
            });

            // If the filter is too aggressive and removes everything, fall back to all local English voices
            if (availableVoices.length === 0) {
                availableVoices = allVoices.filter(voice => voice.lang.toLowerCase().startsWith('en-') && voice.localService);
            }

            // If still no voices, just take the first 5 available English voices as a last resort
            if (availableVoices.length === 0) {
                availableVoices = allVoices.filter(voice => voice.lang.toLowerCase().startsWith('en-')).slice(0, 5);
            }
        }


        // --- FUNCTIONS ---

        /**
         * Renders recipe cards based on current filter settings
         */
        function renderRecipes() {
            const selectedCuisine = cuisineFilter.value;
            const selectedDietary = [...dietaryFilters.querySelectorAll('input:checked')].map(el => el.value);

            const filteredRecipes = recipes.filter(recipe => {
                const cuisineMatch = selectedCuisine === 'all' || recipe.cuisine === selectedCuisine;
                const dietaryMatch = selectedDietary.every(tag => recipe.tags.includes(tag));
                return cuisineMatch && dietaryMatch;
            });

            recipeGrid.innerHTML = ''; // Clear existing grid
            if (filteredRecipes.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                filteredRecipes.forEach(recipe => {
                    const card = document.createElement('div');
                    card.className = 'recipe-card bg-white rounded-xl shadow-md overflow-hidden cursor-pointer';
                    card.innerHTML = `
                        <img class="w-full h-48 object-cover" src="${recipe.image}" alt="${recipe.name}" onerror="this.onerror=null;this.src='https://placehold.co/600x400/cccccc/ffffff?text=Image+Not+Found';">
                        <div class="p-6">
                            <h3 class="text-xl font-semibold text-gray-800">${recipe.name}</h3>
                            <p class="text-teal-600 font-medium mt-1">${recipe.cuisine}</p>
                        </div>
                    `;
                    card.addEventListener('click', () => showRecipeDetail(recipe.id));
                    recipeGrid.appendChild(card);
                });
            }
        }

        /**
         * Displays the recipe detail modal
         * @param {number} recipeId - The ID of the recipe to display
         */
        function showRecipeDetail(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;

            recipeModalContent.innerHTML = `
                <img class="w-full h-64 object-cover rounded-t-2xl" src="${recipe.image}" alt="${recipe.name}" onerror="this.onerror=null;this.src='https://placehold.co/600x400/cccccc/ffffff?text=Image+Not+Found';">
                <div class="p-8">
                    <div class="flex justify-between items-start">
                        <div>
                            <h2 class="text-3xl font-bold text-gray-900">${recipe.name}</h2>
                            <p class="text-teal-600 font-medium mt-1">${recipe.cuisine}</p>
                        </div>
                        <button onclick="closeModal('recipe-modal')" class="text-gray-500 hover:text-gray-800 text-3xl font-bold">&times;</button>
                    </div>
                    <h3 class="text-xl font-semibold mt-6 mb-4">Ingredients</h3>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                        ${recipe.ingredients.map(ing => `
                            <div class="text-center">
                                <img src="${ing.image}" alt="${ing.name}" class="w-20 h-20 mx-auto rounded-full bg-gray-100 object-cover" onerror="this.onerror=null;this.src='https://placehold.co/100x100/cccccc/ffffff?text=...';">
                                <p class="mt-2 font-medium">${ing.name}</p>
                                <p class="text-sm text-gray-500">${ing.amount}</p>
                            </div>
                        `).join('')}
                    </div>
                    <div class="text-center mt-8">
                        <button onclick="startCooking(${recipe.id})" class="bg-teal-600 text-white font-bold py-3 px-8 rounded-full hover:bg-teal-700 transition-colors text-lg">
                            Start Cooking
                        </button>
                    </div>
                </div>
            `;

            recipeModal.classList.add('active');
            // Animate content entrance
            setTimeout(() => {
                recipeModalContent.classList.remove('opacity-0', 'translate-y-4');
                recipeModalContent.classList.add('opacity-100', 'translate-y-0');
            }, 10);
        }

        /**
         * Closes a modal and performs cleanup
         * @param {string} modalId - The ID of the modal to close
         */
        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            const content = modal.querySelector('div[id$="-content"]');

            content.classList.add('opacity-0');
            if (modalId === 'recipe-modal') {
                content.classList.add('translate-y-4');
            } else {
                content.classList.add('scale-95');
            }

            setTimeout(() => {
                modal.classList.remove('active');
                if (modalId === 'cooking-modal') stopCookingSession(); // Ensure session stops
            }, 300);
        }

        /**
         * Initiates the cooking session
         * @param {number} recipeId - The ID of the recipe to cook
         */
        function startCooking(recipeId) {
            const recipe = recipes.find(r => r.id === recipeId);
            if (!recipe) return;

            currentRecipeSteps = recipe.steps;
            currentStepIndex = 0;

            closeModal('recipe-modal');
            setTimeout(() => {
                updateCookingStep();
                cookingModal.classList.add('active');
                // Animate content entrance
                setTimeout(() => {
                    cookingModal.querySelector('#cooking-modal-content').classList.remove('opacity-0', 'scale-95');
                    cookingModal.querySelector('#cooking-modal-content').classList.add('opacity-100', 'scale-100');
                }, 10);
                playMusic();
            }, 350); // Wait for recipe modal to close
        }

        /**
         * Updates the content of the cooking modal to the current step
         */
        function updateCookingStep() {
            const step = currentRecipeSteps[currentStepIndex];
            const sortedVoices = [...availableVoices].sort((a, b) => a.name.localeCompare(b.name));
            cookingModalContent.innerHTML = `
                <p class="text-teal-600 font-bold mb-2">STEP ${currentStepIndex + 1} / ${currentRecipeSteps.length}</p>
                <img src="${step.image}" alt="Step ${currentStepIndex + 1}" class="w-full h-48 md:h-64 rounded-xl object-cover my-4 shadow-lg" onerror="this.onerror=null;this.src='https://placehold.co/400x300/cccccc/ffffff?text=Cooking+Step';">
                <p class="text-lg md:text-xl text-gray-700 leading-relaxed min-h-[6rem]">${step.text}</p>
                <div class="flex justify-center items-center gap-4 mt-6">
                    <button ${currentStepIndex === 0 ? 'disabled' : ''} onclick="changeStep(-1)" class="bg-gray-200 text-gray-700 font-bold py-3 px-6 rounded-full hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
                    <button onclick="narrateStep()" class="bg-teal-600 text-white p-4 rounded-full shadow-lg hover:bg-teal-700">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" viewBox="0 0 20 20" fill="currentColor">
                          <path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" />
                        </svg>
                    </button>
                    <button ${currentStepIndex === currentRecipeSteps.length - 1 ? 'disabled' : ''} onclick="changeStep(1)" class="bg-gray-200 text-gray-700 font-bold py-3 px-6 rounded-full hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
                </div>
                <div class="mt-4 pt-4 border-t border-gray-200">
                    <label for="voice-select" class="text-sm text-gray-600 mr-2">Narration Voice:</label>
                    <select id="voice-select" onchange="narrateStep()" class="p-1 border border-gray-300 rounded-md text-sm bg-white">
                        ${sortedVoices.length > 0 ? sortedVoices.map(voice => `<option value="${voice.name}">${voice.name} (${voice.lang})</option>`).join('') : '<option>Default</option>'}
                    </select>
                </div>
                 <button onclick="closeModal('cooking-modal')" class="mt-6 text-gray-500 hover:text-red-600 font-semibold">End Cooking Session</button>
            `;
            narrateStep(); // Auto-narrate on step change
        }

        /**
         * Changes the current cooking step
         * @param {number} direction - -1 for previous, 1 for next
         */
        function changeStep(direction) {
            currentStepIndex += direction;
            if (currentStepIndex < 0) currentStepIndex = 0;
            if (currentStepIndex >= currentRecipeSteps.length) currentStepIndex = currentRecipeSteps.length - 1;
            speechSynthesis.cancel(); // Stop any ongoing narration
            updateCookingStep();
        }

        /**
         * Narrates the current cooking step using Web Speech API
         */
        function narrateStep() {
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel(); // Cancel previous utterance
                const stepText = currentRecipeSteps[currentStepIndex].text;
                currentUtterance = new SpeechSynthesisUtterance(stepText);

                const voiceSelect = document.getElementById('voice-select');
                if (voiceSelect && voiceSelect.value) {
                    const selectedVoice = availableVoices.find(voice => voice.name === voiceSelect.value);
                    if (selectedVoice) {
                        currentUtterance.voice = selectedVoice;
                    }
                }

                currentUtterance.rate = 0.9; // A slightly slower, clear pace
                currentUtterance.pitch = 1.0; // A more natural, neutral pitch
                speechSynthesis.speak(currentUtterance);
            } else {
                console.log("Speech synthesis not supported.");
            }
        }

        /**
         * Stops the entire cooking session, including music and speech
         */
        function stopCookingSession() {
            stopMusic();
            if ('speechSynthesis' in window) {
                speechSynthesis.cancel();
            }
            currentRecipeSteps = [];
            currentStepIndex = 0;
        }

        // --- Background Music Control ---
        function playMusic() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            // Resume context if it was suspended
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            oscillator = audioContext.createOscillator();
            gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(100, audioContext.currentTime); // Low, calming hum
            gainNode.gain.setValueAtTime(0, audioContext.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.05, audioContext.currentTime + 2); // Fade in gently

            oscillator.start();
        }

        function stopMusic() {
            if (gainNode) {
                gainNode.gain.linearRampToValueAtTime(0, audioContext.currentTime + 1); // Fade out
                setTimeout(() => {
                    if (oscillator) oscillator.stop();
                }, 1000);
            }
        }

        // --- EVENT LISTENERS ---
        cuisineFilter.addEventListener('change', renderRecipes);
        dietaryFilters.addEventListener('change', renderRecipes);

        // Close modal on escape key
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (cookingModal.classList.contains('active')) {
                    closeModal('cooking-modal');
                } else if (recipeModal.classList.contains('active')) {
                    closeModal('recipe-modal');
                }
            }
        });

        // Close modal on outside click
        recipeModal.addEventListener('click', (e) => {
            if (e.target === recipeModal) closeModal('recipe-modal');
        });

        // --- INITIAL RENDER ---
        document.addEventListener('DOMContentLoaded', () => {
            function initVoices() {
                populateVoiceList();
                renderRecipes();
            }

            if (typeof speechSynthesis !== 'undefined') {
                // Some browsers load voices asynchronously.
                if (speechSynthesis.getVoices().length === 0) {
                    speechSynthesis.onvoiceschanged = initVoices;
                } else {
                    initVoices();
                }
            } else {
                renderRecipes();
            }
        });

    </script>
