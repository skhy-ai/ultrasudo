<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stock Screener</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <script src="../desktop/app-shell.js"></script>
  <script src="../desktop/data-manager.js"></script>
  <div class="container">
    <h1>Stock Screener</h1>
    <p>Screen stocks using multiple indicators (e.g., RSI, P/E). Data is fetched from a local Yahoo Finance service (yfinance). Start it with: <code>python service_manager.py start stock-ticker --port 5005</code>. No API key required.</p>

    <div class="controls">
      <label>
        Market
        <select id="market">
          <option value="US">US</option>
          <option value="IN">India</option>
          <option value="CUSTOM">Custom</option>
        </select>
      </label>
      <label class="flex1">
        Symbols (optional; leave empty to use major stocks by sector for the selected market)
        <input id="symbols" type="text" placeholder="e.g. AAPL, MSFT, NVDA" />
      </label>
      <div class="strategy-bar">
        <label>
          Strategy
          <select id="strategy-select"></select>
        </label>
        <button id="save-default-strategy" title="Save the current builder as a reusable strategy">Save Strategy</button>
        <button id="delete-strategy" title="Delete selected user strategy">Delete</button>
        <button id="run">Run Screen</button>
      </div>
    </div>

    <div class="builder">
      <h3>Strategy Builder</h3>
      <div id="conditions"></div>
      <div class="builder-actions">
        <button id="add-condition">Add Condition</button>
        <label>
          RSI Period
          <input id="rsi-period" type="number" value="14" min="2" max="50" />
        </label>
      </div>
    </div>

    <div id="status" class="status"></div>

    <div id="results-container"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
