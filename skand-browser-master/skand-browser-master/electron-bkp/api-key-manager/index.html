<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Key Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  
  <script src="../desktop/data-manager.js"></script>
  <script src="../desktop/file-helper.js"></script>
  <div class="container">
    <h1>API Key Manager</h1>
    <p>Manage API keys centrally. Keys are stored in localStorage via the desktop DataManager.</p>

    <section class="provider">
      <h2>OpenAI</h2>
      <label>API Key <input id="openai-key" type="password" placeholder="sk-..."/></label>
      <label>Model <input id="openai-model" type="text" value="gpt-4o-mini"/></label>
      <label>Base URL <input id="openai-base" type="text" value="https://api.openai.com/v1"/></label>
      <div class="actions">
        <button id="save-openai">Save</button>
        <button id="test-openai">Test</button>
      </div>
      <div id="openai-status" class="status"></div>
    </section>

    <section class="provider">
      <h2>Gemini</h2>
      <label>API Key <input id="gemini-key" type="password" placeholder="AIza..."/></label>
      <label>Model <input id="gemini-model" type="text" value="gemini-1.5-flash"/></label>
      <label>Base URL <input id="gemini-base" type="text" value="https://generativelanguage.googleapis.com"/></label>
      <div class="actions">
        <button id="save-gemini">Save</button>
        <button id="test-gemini">Test</button>
      </div>
      <div id="gemini-status" class="status"></div>
    </section>

    <section class="provider">
      <h2>LMStudio</h2>
      <label>Base URL <input id="lmstudio-base" type="text" value="http://localhost:1234"/></label>
      <label>Model <input id="lmstudio-model" type="text" placeholder="(optional)"/></label>
      <div class="actions">
        <button id="save-lmstudio">Save</button>
        <button id="test-lmstudio">Test</button>
      </div>
      <div id="lmstudio-status" class="status"></div>
    </section>

    <section class="provider">
      <h2>Alpha Vantage</h2>
      <label>API Key <input id="av-key" type="password" placeholder="Alpha Vantage key"/></label>
      <div class="actions">
        <button id="save-av">Save</button>
        <button id="test-av">Test</button>
      </div>
      <div id="av-status" class="status"></div>
    </section>
  </div>
  <script src="../desktop/data-manager.js"></script>
  <script src="script.js"></script>
  
</body>
</html>
