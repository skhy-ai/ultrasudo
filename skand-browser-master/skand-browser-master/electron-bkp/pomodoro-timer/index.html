<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro Timer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
  
  <script src="../desktop/data-manager.js"></script>
  <script src="../desktop/file-helper.js"></script>
  <div class="pomodoro-container">
    <h1><i class="fas fa-hourglass-half"></i> Pomodoro Timer</h1>
    <div class="timer-display" id="display">25:00</div>
    <div class="controls">
      <button id="start">Start</button>
      <button id="pause">Pause</button>
      <button id="reset">Reset</button>
      <button id="skip">Skip</button>
    </div>
    <div class="settings">
      <label>Work Time (minutes): <input type="number" id="work-time" value="25" min="1" max="60"></label>
      <label>Break Time (minutes): <input type="number" id="break-time" value="5" min="1" max="30"></label>
      <label>Long Break Time (minutes): <input type="number" id="long-break-time" value="15" min="1" max="60"></label>
      <label>Cycles before long break: <input type="number" id="cycles" value="4" min="1" max="10"></label>
    </div>
    <div class="status" id="status">Ready</div>
  </div>
  <script src="script.js"></script>
  
</body>
</html>
