<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Board</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../src/vendor/fontawesome/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-container">
    <header class="app-header">
      <h2><i class="fa-solid fa-arrow-trend-up"></i> Investment Board</h2>
      <div class="header-right">
        <span class="status-indicator">● Market Open</span>
      </div>
    </header>

    <main class="dashboard">
      <!-- Strategy & Risk Section -->
      <section class="strategy-section panel">
        <div class="panel-header" style="margin-bottom: 12px;">
          <h3>Investment Strategy & Risks</h3>
        </div>
        <div class="strategy-grid">
          <div class="strategy-item">
            <label for="risk-factors">Factors of Risk</label>
            <textarea id="risk-factors" placeholder="Document potential risks here..."></textarea>
          </div>
          <div class="strategy-item">
            <label for="inv-strategy">Strategy</label>
            <textarea id="inv-strategy" placeholder="Document investment strategy here..."></textarea>
          </div>
          <div class="strategy-item">
            <label for="market-growth">Overall Market Growth</label>
            <textarea id="market-growth" placeholder="Track macro market trends here..."></textarea>
          </div>
        </div>
      </section>

      <section class="watchlist-section panel">
        <div class="panel-header">
          <h3>Your Watchlist</h3>
          <div class="search-bar">
            <input type="text" id="ticker-input" placeholder="Add Ticker (e.g. MSFT)">
            <button id="add-ticker-btn"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>

        <div class="grid-container" id="watchlist-grid">
          <!-- Cards injected by JS -->
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../auth/config.js"></script>
  <!-- Use a lightweight sparkline library -->
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  <script src="script.js"></script>
</body>

</html>
