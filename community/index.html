<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Community Apps</title>
    <!-- Supabase Auth -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../auth/config.js"></script>
    <script src="../auth/auth-check.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #0f172a;
        }

        header {
            background: #fff;
            border-bottom: 1px solid #e2e8f0;
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            color: #1e293b;
        }

        .container {
            display: flex;
            max-width: 1200px;
            margin: 40px auto;
            gap: 40px;
            padding: 0 20px;
        }

        .main-content {
            flex: 2;
        }

        .sidebar {
            flex: 1;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            height: fit-content;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .app-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .app-icon {
            font-size: 40px;
            color: #3b82f6;
            margin-bottom: 15px;
        }

        .app-name {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .app-desc {
            font-size: 14px;
            color: #64748b;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: #0f172a;
            border: 1px solid #cbd5e1;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-danger {
            background: #fee2e2;
            color: #ef4444;
            border: 1px solid #fca5a5;
        }

        .btn-danger:hover {
            background: #fca5a5;
            color: #b91c1c;
        }

        /* Form Styles */
        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
            color: #475569;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-family: inherit;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>

<body>
    <header>
        <h1><i class="fas fa-users-viewfinder" style="color: #3b82f6; margin-right: 10px;"></i>Community Apps</h1>
        <a href="/desktop" class="btn btn-secondary">Back to Desktop</a>
    </header>

    <div class="container">
        <div class="main-content">
            <h2 style="margin-top:0; color:#1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">Discover
                Apps</h2>
            <div id="community-app-grid" class="app-grid">
                <!-- Apps will be injected here -->
            </div>

            <h2 style="margin-top:40px; color:#1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">
                Installed Apps</h2>
            <div id="installed-community-grid" class="app-grid">
                <!-- Installed custom apps -->
            </div>
        </div>

        <div class="sidebar">
            <h3 style="margin-top:0; color:#1e293b;">Submit an App</h3>
            <p style="font-size: 14px; color:#64748b; margin-bottom: 20px;">Built something cool? Share it with the
                community!</p>
            <form id="submit-app-form">
                <div class="form-group">
                    <label>App Name</label>
                    <input type="text" id="app-name" required placeholder="e.g. My Cool Tool">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="app-desc" rows="3" required placeholder="What does this app do?"></textarea>
                </div>
                <div class="form-group">
                    <label>URL / Path</label>
                    <input type="text" id="app-path" required placeholder="https://... or ../my-app/index.html">
                </div>
                <div class="form-group">
                    <label>Icon (FontAwesome Class)</label>
                    <input type="text" id="app-icon" placeholder="fas fa-star" value="fas fa-star" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Application</button>
            </form>
        </div>
    </div>

    <script src="community.js"></script>
</body>

</html>
