<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
        }

        .btn {
            display: inline-block;
            padding: 12px 24px;
            background-color: #2563eb;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Welcome to Ultrasudo!</h2>
        <p>We're excited to have you on board. Ultrasudo is your personal, secure, open-source desktop environment.
        </p>
        <p>Please confirm your email address by clicking the link below:</p>
        <a href="{{ .ConfirmationURL }}" class="btn">Confirm Email Address</a>
        <p>If you did not request this, you can safely ignore this email.</p>
    </div>
</body>

</html>
