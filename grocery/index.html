<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shop - Healthy Grocery Planner</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #27ae60;
            --accent: #f1c40f;
            --text: #2f3640;
            --bg: #f5f6fa;
            --card-bg: #ffffff;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            --low-gi: #2ecc71;
            --med-gi: #f1c40f;
            --high-gi: #e67e22;
        }

        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin: 0;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        h1 i {
            color: var(--primary);
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .section-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Grocery List Items */
        .grocery-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .grocery-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #fdfdfd;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid #eee;
            transition: all 0.2s;
        }

        .grocery-item:hover {
            border-color: var(--primary);
            transform: scale(1.01);
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .item-gi-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .gi-low {
            background-color: var(--low-gi);
        }

        .gi-med {
            background-color: var(--med-gi);
        }

        .gi-high {
            background-color: var(--high-gi);
        }

        .btn-remove {
            color: #ff7675;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .btn-remove:hover {
            opacity: 1;
        }

        /* Quick Add */
        .quick-add-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .food-card {
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .food-card:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
        }

        .food-card .gi-tag {
            font-size: 0.7rem;
            position: absolute;
            bottom: 5px;
            right: 8px;
            opacity: 0.8;
        }

        /* Right Sidebar */
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            font-family: inherit;
        }

        .btn {
            padding: 12px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: inherit;
        }

        .btn-add {
            background-color: var(--primary);
            color: white;
        }

        /* Delivery Buttons */
        .delivery-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .delivery-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #fff;
            color: #2f3640;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .delivery-btn:hover {
            border-color: var(--primary);
            background: #f0fff4;
        }

        .gi-legend {
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #eee;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
    </style>
</head>

<body>
    <script src="../desktop/file-helper.js"></script>
    <script src="../desktop/data-manager.js"></script>
    <div class="container">

        <header>
            <h1><i class="fas fa-shopping-basket"></i> SMART SHOP</h1>
            <div id="date-display" style="font-weight: 500; opacity: 0.7;">Friday, Feb 27</div>
        </header>

        <div class="layout">
            <main>
                <div class="card">
                    <div class="section-title"><i class="fas fa-magic"></i> Quick Add Healthy Choices</div>
                    <div class="quick-add-grid" id="quick-add-grid">
                        <!-- Populated by JS -->
                    </div>
                </div>

                <div class="card" style="margin-top: 30px;">
                    <div class="section-title"><i class="fas fa-list-ul"></i> Your Shopping List</div>
                    <ul class="grocery-list" id="grocery-list">
                        <!-- Populated by JS -->
                    </ul>
                    <div id="empty-state" style="text-align: center; padding: 40px; opacity: 0.5;">
                        <i class="fas fa-clipboard-list" style="font-size: 3rem; margin-bottom: 15px;"></i>
                        <p>Your list is empty. Start adding items!</p>
                    </div>
                </div>
            </main>

            <aside class="sidebar">
                <div class="card">
                    <div class="section-title"><i class="fas fa-plus-circle"></i> Add Custom Item</div>
                    <div class="input-group">
                        <input type="text" id="custom-item" placeholder="e.g. Almond Milk">
                        <button class="btn btn-add" onclick="addCustomItem()">Add</button>
                    </div>
                    <div class="gi-legend">
                        <div class="legend-item"><span class="item-gi-dot gi-low"></span> Low GI</div>
                        <div class="legend-item"><span class="item-gi-dot gi-med"></span> Medium</div>
                        <div class="legend-item"><span class="item-gi-dot gi-high"></span> High</div>
                    </div>
                </div>

                <div class="card">
                    <div class="section-title"><i class="fas fa-truck"></i> Order Online</div>
                    <div class="delivery-grid">
                        <a href="#" target="_blank" class="delivery-btn" onclick="openStore('Instacart')">
                            <i class="fas fa-shipping-fast"></i> Instacart
                        </a>
                        <a href="#" target="_blank" class="delivery-btn" onclick="openStore('Walmart')">
                            <i class="fas fa-store"></i> Walmart
                        </a>
                        <a href="#" target="_blank" class="delivery-btn" onclick="openStore('Amazon Fresh')">
                            <i class="fab fa-amazon"></i> Amazon Fresh
                        </a>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const glycemicFoods = [
            { name: "Rolled Oats", type: "low", gi: 55, color: "#e0c8b0" },
            { name: "Quinoa", type: "low", gi: 53, color: "#95a5a6" },
            { name: "Lentils", type: "low", gi: 32, color: "#bdc3c7" },
            { name: "Apples", type: "low", gi: 36, color: "#ff4d4d" },
            { name: "Berries", type: "low", gi: 40, color: "#9b59b6" },
            { name: "Broccoli", type: "low", gi: 15, color: "#27ae60" },
            { name: "Spinach", type: "low", gi: 15, color: "#2ecc71" },
            { name: "Avocado", type: "low", gi: 15, color: "#16a085" },
            { name: "Salmon", type: "low", gi: 0, color: "#fa8072" },
            { name: "Tofu", type: "low", gi: 15, color: "#ecf0f1" },
            { name: "Greek Yogurt", type: "low", gi: 11, color: "#f9f9f9" },
            { name: "Almonds", type: "low", gi: 0, color: "#d2b48c" },
            { name: "Sweet Potato", type: "medium", gi: 63, color: "#e67e22" },
            { name: "Banana", type: "medium", gi: 62, color: "#f1c40f" }
        ];

        let list = JSON.parse(localStorage.getItem('smart-shop-list') || '[]');

        function init() {
            const grid = document.getElementById('quick-add-grid');
            glycemicFoods.forEach(food => {
                const card = document.createElement('div');
                card.className = 'food-card';
                card.style.backgroundColor = food.color;
                if (food.color === '#ecf0f1' || food.color === '#f9f9f9' || food.color === '#bdc3c7') {
                    card.style.color = '#2f3640';
                }
                card.innerHTML = `
                    ${food.name}
                    <span class="gi-tag">GI: ${food.gi}</span>
                `;
                card.onclick = () => addItem(food);
                grid.appendChild(card);
            });
            renderList();
            document.getElementById('date-display').textContent = new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });
        }

        function addItem(item) {
            const existing = list.find(x => x.name === item.name);
            if (!existing) {
                list.push({ ...item, id: Date.now() });
                saveAndRender();
            }
        }

        function addCustomItem() {
            const input = document.getElementById('custom-item');
            const name = input.value.trim();
            if (name) {
                list.push({ name, type: 'unknown', gi: '?', color: '#eee', id: Date.now() });
                input.value = '';
                saveAndRender();
            }
        }

        function removeItem(id) {
            list = list.filter(item => item.id !== id);
            saveAndRender();
        }

        function saveAndRender() {
            localStorage.setItem('smart-shop-list', JSON.stringify(list));
            renderList();
        }

        function renderList() {
            const ul = document.getElementById('grocery-list');
            const empty = document.getElementById('empty-state');
            ul.innerHTML = '';

            if (list.length === 0) {
                empty.style.display = 'block';
            } else {
                empty.style.display = 'none';
                list.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'grocery-item';
                    const giClass = item.type === 'low' ? 'gi-low' : (item.type === 'medium' ? 'gi-med' : (item.type === 'high' ? 'gi-high' : ''));
                    li.innerHTML = `
                        <div class="item-info">
                            <span class="item-gi-dot ${giClass}"></span>
                            <span>${item.name}</span>
                        </div>
                        <i class="fas fa-times btn-remove" onclick="removeItem(${item.id})"></i>
                    `;
                    ul.appendChild(li);
                });
            }
        }

        function openStore(store) {
            const items = list.map(i => i.name).join(' ');
            let url = '';
            if (store === 'Instacart') url = `https://www.instacart.com/store/search/${encodeURIComponent(items)}`;
            else if (store === 'Walmart') url = `https://www.walmart.com/search?q=${encodeURIComponent(items)}`;
            else if (store === 'Amazon Fresh') url = `https://www.amazon.com/s?k=${encodeURIComponent(items)}&i=amazonfresh`;

            window.open(url, '_blank');
        }

        init();
    </script>
</body>

</html>
